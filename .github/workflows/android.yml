# طفّيها — builds the Android app in the cloud, so no Android Studio is needed locally:
#   tafiha-debug-apk    a test APK to install on an Android phone;
#   tafiha-play-bundle  the store build (.aab) for Google Play, signed with the upload key in the
#                       ANDROID_UPLOAD_KEY secret (made once by scripts/release-key.mjs, see PLAY.md).
# Every run gets a higher version code (the run number), as Google Play requires.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'delete-account.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-app.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAFIHA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # the runner already has the Android SDK; make sure its licences are accepted
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Copy the app into the Android project
        run: |
          node scripts/build-app.mjs
          npx cap sync android

      - name: Build the test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tafiha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Without the secret (before the key exists) a throwaway key signs the bundle, only to prove
      # the store build still works; that file isn't kept and could never go to the store.
      - name: Build the store bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY }}
        run: |
          key="$RUNNER_TEMP/upload-key"
          mkdir -p "$key"
          if [ -n "$ANDROID_UPLOAD_KEY" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEY" | tr -d ' \r\n' | base64 -d > "$key/key.json"
            pass=$(jq -r .password "$key/key.json")
            echo "::add-mask::$pass"
            jq -r .keystore "$key/key.json" | base64 -d > "$key/upload.p12"
            rm "$key/key.json"
            echo "TAFIHA_STORE_SIGNED=1" >> "$GITHUB_ENV"
          else
            pass=$(openssl rand -hex 24)
            echo "::add-mask::$pass"
            printf '%s' "$pass" > "$key/pass"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 30 -nodes -keyout "$key/key.pem" -out "$key/cert.pem" -subj "/CN=Throwaway" 2> /dev/null
            openssl pkcs12 -export -inkey "$key/key.pem" -in "$key/cert.pem" -name upload -out "$key/upload.p12" -passout "file:$key/pass"
            echo "No ANDROID_UPLOAD_KEY secret: signed with a throwaway key (not for the store)."
          fi
          keytool -list -storetype pkcs12 -keystore "$key/upload.p12" -storepass "$pass" -alias upload > /dev/null
          TAFIHA_UPLOAD_STORE="$key/upload.p12" TAFIHA_UPLOAD_PASSWORD="$pass" ./gradlew bundleRelease --no-daemon --stacktrace
          rm -rf "$key"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q 'jar verified'
          echo "Store bundle ready, version code $TAFIHA_VERSION_CODE"

      - if: env.TAFIHA_STORE_SIGNED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: tafiha-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
